name: open-chat-session
kind: platform
version: 0.1.0
description: >
  Native HTTP/SSE client gateway with a hash-chained event log per session.
  Runs alongside hermes's stock api_server (does not replace it). Auth via
  Tailscale identity or bearer token fallback.
author: Timon Gentzsch
optional_env:
  - name: OPEN_CHAT_SESSION_EDGE_BIND
    description: "Tailnet edge bind address. Defaults to 127.0.0.1:9120."
    prompt: "Bind address (host:port)"
    password: false
  - name: OPEN_CHAT_SESSION_BIND
    description: "Native gateway bind address. Defaults to 127.0.0.1:8765."
    prompt: "Gateway bind address (host:port)"
    password: false
  - name: OPEN_CHAT_SESSION_EDGE_ENABLED
    description: "Enable the plugin-owned Tailscale Serve edge proxy. Defaults to true."
    prompt: "Enable tailnet edge proxy"
    password: false
  - name: OPEN_CHAT_SESSION_EDGE_DASHBOARD_URL
    description: "Loopback Hermes dashboard URL proxied by the edge. Defaults to http://127.0.0.1:9119."
    prompt: "Hermes dashboard URL"
    password: false
